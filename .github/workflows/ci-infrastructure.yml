# ============================================================
#  CI DEPLOYMENT PIPELINE — Dev / Staging
#  .github/workflows/ci-staging-deploy.yml
#
#  Triggers on every push to any non-main branch.
#  Runs checks first, then auto-deploys to staging if they pass.
#  Main branch deployments are handled by cd-deploy-workspaces.yml.
#
#  Flow:
#    push (non-main) → format → validate → security (tflint -> tfsec -> secret scan) → smoke-test
#    plan
# ============================================================

name: CI Deploy

on:
  push:
    branches:
      - "**"
      - "!main"   

permissions:
   contents: read

env:
  TF_VERSION: "1.7.0"
  REPOSITORY: "adiallo47/terraform-infra-workspaces"
  WORKING_DIR: "terraform-infrastructure"
  ENVIRONMENT: "staging"
  TF_VAR_PUBLIC_KEY: ${{ secrets.EC2_PUBLIC_KEY }}
  TF_LINT: "terraform-linters/tflint-action@v1.0.0"

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ── 1. FORMAT ──────────────────────────────────────────
  format:
    name: "format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: terraform repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPOSITORY }}
          path: ${{ env.WORKING_DIR }}
          token : ${{ secrets.GITHUB_TOKEN }}

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: format check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

# ── 2. VALIDATE ──────────────────────────────────────────
  validate:
    name: "validate"
    runs-on: ubuntu-latest
    needs: [format]
    steps:
    - uses: actions/checkout@v4

    - name: terraform repo
      uses: actions/checkout@v4
      with:
          repository: ${{ env.REPOSITORY }}
          path: ${{ env.WORKING_DIR }}
          token : ${{ secrets.GITHUB_TOKEN }}
    
    - name: setup terraform    
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: terraform init
      run: terraform init
      working-directory: ${{ env.WORKING_DIR }}

    - name: terraform validate
      run: terraform validate
      working-directory: ${{ env.WORKING_DIR }}
      env:
        TF_VAR_PUBLIC_KEY: ${{ secrets.EC2_PUBLIC_KEY }}

# ── 3. SECURITY ──────────────────────────────────────────      
  security: 
    name: "security"
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
    - uses: actions/checkout@v4
      with: 
        fetch-depth: 0
        repository: ${{ env.REPOSITORY }}
        token : ${{ secrets.GITHUB_TOKEN }}
       
    - name: run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ${{ env.WORKING_DIR }}
        soft_fail: false

    - name: setup tflint
      uses: terraform-linters/setup-tflint@v6.2.1
      
    # - name: run tflint
    #   run: |
    #    tflint --init
    #    tflint --recursive
    #   working-directory: ${{ env.WORKING_DIR }}

    - name: install gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     

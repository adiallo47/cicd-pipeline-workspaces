# ============================================================
#  CI DEPLOYMENT PIPELINE — Dev / Staging
#  .github/workflows/ci-staging-deploy.yml
#
#  Triggers on every push to any non-main branch.
#  Runs checks first, then auto-deploys to staging if they pass.
#  Main branch deployments are handled by cd-deploy-workspaces.yml.
#
#  Flow:
#    push (non-main) → validate → lint → security-scan
#                    → tg-plan-staging
#                    → tg-apply-staging (auto, no approval)
#                    → ansible-deploy-staging
#                    → smoke-test
# ============================================================

name: CI Deploy

on:
  push:
    branches:
      - "**"
      - "!main"                 

env:
  TF_VERSION: "1.7.0"
  WORKING_DIR: "/Users/amadoudiallo/IdeaProjects/workspace-deployment/terraform-infrastructure"
  ENVIRONMENT: "staging"

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true          # cancel older staging deploys on new push


jobs:
  # ── 1. FORMAT ──────────────────────────────────────────
  format:
    name: "format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.ENVIRONMENT }}

# ── 2. VALIDATE ──────────────────────────────────────────
  validate:
    name: "validate"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Terraform    
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Validate
      run: terraform validate
      working-directory: ${{ env.WORKING_DIR }}

# ── 3. SECURITY ──────────────────────────────────────────      
  security: 
    name: "security"
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
    - uses: actions/checkout@v4

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: ${{ env.WORKING_DIR }}
        soft_fail: false 

    - name: Checkov
      uses: bridgecrewio/checkov-action@12
      with:
        working_directory: ${{ env.WORKING_DIR }}
        framework: terraform
        soft_fail: false
